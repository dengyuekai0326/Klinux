# 现场调参只改本文件。比例坐标不受摄像头分辨率变化影响。
camera:
  # 按名称自动寻找有效采集节点，避免重新插拔后video编号变化。
  device: "auto:MF500 camera"
  # YOLO的16:9有效输入就是640x360，直接采集该尺寸可省去二次缩放。
  width: 640
  height: 360
  fps: 30
  fourcc: MJPG
  # MF500在当前UVC驱动下设为1会隔帧，只能约8FPS；2可恢复设备满速。
  buffer_size: 2
  reconnect_delay_sec: 0.5
  maximum_frame_age_sec: 0.08

model:
  path: models/best.engine
  fallback_path: models/best.pt
  # 只将完整水管条带送入模型；高、宽都必须是32的倍数。
  imgsz: [192, 640]
  crop_top_ratio: 0.25
  crop_bottom_ratio: 0.75
  # 固定水管ROI已排除绝大多数误检，适当降低阈值以保留高速拖影。
  confidence: 0.10
  iou: 0.50
  max_detections: 3
  device: 0
  # 仅对桌面best.pt生效；TensorRT engine内部精度由engine决定。
  half: true

calibration:
  # 水管中钢球中心能够到达的左端、原点、右端横坐标比例。
  # 首次上机必须根据调试画面的竖线微调。
  left_x_ratio: 0.100
  center_x_ratio: 0.495
  right_x_ratio: 0.895
  half_length_cm: 12.5
  # 新固定结构中钢球中心约在Y=0.479；保留上下装配和振动余量。
  detection_x_margin_ratio: 0.035
  detection_y_min_ratio: 0.40
  detection_y_max_ratio: 0.65

tracking:
  # Alpha-Beta 位置/速度滤波。较高alpha保证快速运动时响应及时。
  alpha: 0.72
  beta: 0.16
  acceleration_alpha: 0.18
  velocity_deadband_units_per_sec: 12.0
  maximum_speed_units_per_sec: 1800.0
  reacquire_gate_units: 80.0
  maximum_prediction_sec: 0.12
  measurement_timeout_sec: 0.15

serial:
  enabled: true
  port: /dev/ttyACM0
  baudrate: 115200
  timeout_sec: 0.01
  tx_rate_hz: 30.0
  prediction_horizon_sec: 0.08
  send_ball_state: true
  send_task_state: true
  task_state_keepalive_sec: 0.50
  log_tx: false
  log_rx: true

modes:
  mode1_target_cm: 0.0
  mode1_tolerance_cm: 0.5
  mode1_hold_sec: 1.0

  mode2_targets_cm: [0.0, 5.0, -5.0]
  mode2_tolerance_cm: 0.5
  mode2_hold_sec: [0.3, 0.5, 1.0]
  mode2_timeout_sec: 5.0

  mode3_tolerance_cm: 0.5
  mode3_hold_sec: 1.0

debug:
  enabled: true
  display_rate_hz: 30.0
  performance_log_period_sec: 5.0
